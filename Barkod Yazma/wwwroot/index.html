<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiket Yazdırma</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>
    <style>
        /* Etiket önizleme için 10x8 orantısı (Yatay), 100mm x 80mm -> 5:4 aspect ratio */
        .preview-label {
            aspect-ratio: 5/4;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 2px solid #e5e7eb;
            color: black;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            text-transform: uppercase;
        }

        .input-upper {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-6 pb-20">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6 border-l-4 border-indigo-600">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800">Depo Etiket Merkezi</h1>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-gray-500">PIN:</span>
                <input type="password" v-model="pin" class="border p-2 rounded w-20 text-center focus:ring focus:ring-indigo-200 outline-none" maxlength="4" placeholder="••••">
            </div>
        </header>

        <!-- Main Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Left: Form -->
            <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 border-b pb-2 text-gray-700">Etiket Bilgileri</h2>
                
                <form @submit.prevent="submitPrintJob" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">PROJE ADI</label>
                        <input type="text" v-model="form.projectName" required @input="form.projectName = $event.target.value.toUpperCase()"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none input-upper transition-shadow" 
                            placeholder="Örn: HITACHI ENERGY">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">LOKASYON</label>
                        <input type="text" v-model="form.location" required @input="form.location = $event.target.value.toUpperCase()"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none input-upper transition-shadow" 
                            placeholder="Örn: DILOVASI-CT">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">PROJE KODU <span class="text-xs font-normal text-gray-500">(Sayı)</span></label>
                            <input type="number" v-model.number="form.projectCode" required min="1"
                                class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none transition-shadow" 
                                placeholder="38697">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">KOLİ SAYISI</label>
                            <input type="number" v-model.number="form.boxCount" required min="1" max="50"
                                class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none transition-shadow" 
                                placeholder="Adet">
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" 
                            :disabled="isLoading || !isFormValid"
                            class="w-full flex justify-center items-center gap-2 text-white font-bold text-lg p-4 rounded-xl transition-all shadow-md"
                            :class="[
                                isLoading || !isFormValid ? 'bg-gray-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 hover:shadow-lg active:scale-[0.98]'
                            ]">
                            
                            <svg v-if="isLoading" class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <svg v-else xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                            </svg>
                            {{ isLoading ? 'YAZICIYA GÖNDERİLİYOR...' : 'ETİKETİ YAZDIR' }}
                        </button>
                    </div>
                </form>

                <!-- Status Messages -->
                <div v-if="message" class="mt-4 p-4 rounded-lg font-semibold flex items-center gap-2" :class="messageType === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                    <span v-if="messageType === 'success'">✔️</span>
                    <span v-else>⚠️</span>
                    {{ message }}
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="flex flex-col">
                <h2 class="text-sm font-bold mb-2 text-gray-500 uppercase tracking-wider flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                    Gerçek Boyut Önizlemesi (10x8 Yatay)
                </h2>
                <div class="preview-label w-full max-w-[360px] mx-auto md:mx-0">
                    <div class="text-[clamp(1.8rem,2.5vw,2.5rem)] leading-tight break-words border-b-2 border-transparent w-full">
                        {{ form.projectName || 'PROJE ADI' }}
                    </div>
                    
                    <div class="text-[clamp(1.5rem,2vw,1.8rem)] leading-tight break-words w-full">
                        {{ form.location || 'LOKASYON' }}
                    </div>
                    
                    <div class="text-[clamp(1.8rem,2.5vw,2.5rem)] break-words w-full">
                        {{ form.projectCode ? form.projectCode : 'XXXXX' }} ({{ form.boxCount ? form.boxCount : 'X' }} KOLI)
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
